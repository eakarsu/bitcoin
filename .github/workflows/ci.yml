name: governed-trading-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: trading_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trading_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trading_test
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      ENABLE_LEGACY_DEMO_SURFACES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: npm
          cache-dependency-path: |
            trading-platform/package-lock.json
            trading-platform/backend/package-lock.json
      - name: Install locked dependencies
        working-directory: trading-platform
        run: npm ci && npm --prefix backend ci
      - name: Apply and replay migrations
        working-directory: trading-platform/backend
        run: npm run migrate && npm run migrate
      - name: Backend checks and PostgreSQL journey
        working-directory: trading-platform/backend
        run: npm run check && npm audit --omit=dev --audit-level=high
      - name: Frontend checks
        working-directory: trading-platform
        run: npm run lint && npm run build && npm audit --omit=dev --audit-level=high
      - name: Validate container topology
        working-directory: trading-platform
        env:
          POSTGRES_PASSWORD: validation-only
          JWT_SECRET: validation-secret-with-at-least-32-characters
          PUBLIC_ORIGIN: https://paper.example.invalid
          MARKET_DATA_WEBHOOK_SECRETS_JSON: '{"licensed-market":"validation-secret-with-at-least-32-chars"}'
        run: docker compose config --quiet && docker build -f Dockerfile.api . && docker build -f Dockerfile.web .
